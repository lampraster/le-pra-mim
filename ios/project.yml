name: LePraMim
options:
  bundleIdPrefix: io.github.lampraster
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  LePraMim:
    type: application
    platform: iOS
    sources:
      - path: LePraMim
    info:
      path: LePraMim/Info.plist
      properties:
        CFBundleDisplayName: "Lê pra Mim"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: LePraMim
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lampraster.lepramim
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: LePraMim/LePraMim-Bridging-Header.h
        # ONNX Runtime estático (pacote oficial Microsoft.ML.OnnxRuntime do NuGet), baixado pelo workflow
        # em ios/Vendor. Mesmas opções de link que o pacote declara: -lc++, CoreML fraco e force_load.
        FRAMEWORK_SEARCH_PATHS: ["$(PROJECT_DIR)/Vendor/onnxruntime.xcframework/ios-arm64"]
        OTHER_LDFLAGS: ["-lc++", "-weak_framework", "CoreML", "-force_load", "$(PROJECT_DIR)/Vendor/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/onnxruntime"]
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  LePraMim:
    build:
      targets:
        LePraMim: all
    run:
      config: Debug
    archive:
      config: Release
